name: Update Database

on:
  schedule:
    - cron: "0 */1 * * *"  # every hour
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyyaml

      - name: Setup secrets
        run: echo "${{ secrets.GH_KEY }}" > secrets.yml

      - name: Run update script
        run: |
          export PYTHONPATH=$(pwd)/src:$PYTHONPATH
          python scripts/scrape_brb_app.py
          python scripts/format_raw_data.py
          python db_main.py --read-brb-file data/formatted_data.csv --read-brb-warmup-file data/raw_brb_data_warmups.csv

      - name: Commit & Push Changes
        env:
            PAT:
                ${{ secrets.GH_PAT }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sa_training.db
          git commit -m "Update plot"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
          # git push https://x-access-token:${PAT}@github.com/${{ github.repository }}.git
          git remote get-url origin
          git push origin HEAD:main
