name: Update Database

on:
  schedule:
    - cron: "0 */1 * * *"  # every hour
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup secrets
        run: echo "${{ secrets.GH_KEY }}" > secrets.yml

      - name: Get old max date
        id: old_max_date
        run: |
          OLD_MAX_DATE=$(sqlite3 sa_training.db "SELECT MAX(timestamp) FROM departures;")
          echo "OLD_MAX_DATE=$OLD_MAX_DATE" >> $GITHUB_ENV

      - name: Run update script
        run: |
          export PYTHONPATH=$(pwd)/src:$PYTHONPATH
          python scripts/scrape_brb_app.py
          python scripts/format_raw_data.py
          python db_main.py --read-brb-file data/formatted_data.csv --read-brb-warmup-file data/raw_brb_data_warmups.csv

      - name: Commit & push if new data
        env:
            OLD_MAX_DATE: ${{ env.OLD_MAX_DATE }}
        run: |
          NEW_MAX_DATE=$(sqlite3 sa_training.db "SELECT MAX(timestamp) FROM departures;")
          if [[ "$NEW_MAX_DATE" > "$OLD_MAX_DATE" ]]; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add sa_training.db
            git commit -m "Update database" || echo "No changes to commit"
            git remote get-url origin
            git push origin HEAD:main
          else
              echo "No new data. Skipping commit."
          fi
